name: Deploy to DigitalOcean

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Build assets
        run: |
          pnpm install --frozen-lockfile
          echo "-------------- Building SDK for Production --------------"
          pnpm run build:sdk
          echo "-------------- Building App for Production --------------"
          RAILS_ENV=production npx vite build

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"

          # Git pull and run migrations on server
          ssh $SSH_OPTS root@${{ secrets.DEPLOY_HOST }} '
            su - chatwoot -c "cd chatwoot && git pull --ff-only origin develop && RAILS_ENV=production bundle exec rails db:migrate"
          '

          # Rsync built assets to server (SDK -> public/packs, App -> public/vite)
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            public/packs/ \
            root@${{ secrets.DEPLOY_HOST }}:/home/chatwoot/chatwoot/public/packs/
          rsync -avz --delete -e "ssh $SSH_OPTS" \
            public/vite/ \
            root@${{ secrets.DEPLOY_HOST }}:/home/chatwoot/chatwoot/public/vite/

          # Fix ownership and restart
          ssh $SSH_OPTS root@${{ secrets.DEPLOY_HOST }} '
            chown -R chatwoot:chatwoot /home/chatwoot/chatwoot/public/packs /home/chatwoot/chatwoot/public/vite &&
            systemctl restart chatwoot.target
          '
