name: Deploy to DigitalOcean

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} '
            su - chatwoot -c "cd chatwoot && git pull --ff-only origin develop && RAILS_ENV=production bundle exec rails db:migrate" &&
            systemctl restart chatwoot.target
          '
