name: Deploy to DigitalOcean

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} '
            # Ensure swap exists for asset compilation on low-memory servers
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            elif ! swapon --show | grep -q /swapfile; then
              swapon /swapfile 2>/dev/null || true
            fi &&
            su - chatwoot -c "cd chatwoot && git pull --ff-only origin develop && RAILS_ENV=production bundle exec rails db:migrate && NODE_OPTIONS=--max-old-space-size=1536 RAILS_ENV=production bundle exec rake assets:precompile" &&
            systemctl restart chatwoot.target
          '
